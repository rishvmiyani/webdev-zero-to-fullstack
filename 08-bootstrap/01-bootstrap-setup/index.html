<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 5 Setup</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100 py-5">
    <div class="container">
        <!-- Hero Jumbotron -->
        <div class="row mb-5">
            <div class="col-12 text-center">
                <h1 class="display-3 fw-bold text-primary mb-4">Bootstrap 5</h1>
                <p class="lead text-muted fs-4">Fast, responsive UI components built with HTML, CSS, and JS</p>
                <button class="btn btn-primary btn-lg px-5 py-3 shadow-lg">Get Started</button>
            </div>
        </div>

        <!-- Grid Demo -->
        <div class="row g-4 mb-5">
            <div class="col-lg-3 col-md-6 col-sm-12">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-body text-center p-4">
                        <i class="bi bi-grid-3x3-gap-fill text-primary display-4 mb-3"></i>
                        <h5 class="card-title fw-bold">Grid System</h5>
                        <p class="card-text text-muted">12-column responsive grid</p>
                    </div>
                </div>
            </div>
            <div class="col-lg-3 col-md-6 col-sm-12">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-body text-center p-4">
                        <i class="bi bi-phone text-success display-4 mb-3"></i>
                        <h5 class="card-title fw-bold">Responsive</h5>
                        <p class="card-text text-muted">Mobile-first approach</p>
                    </div>
                </div>
            </div>
            <div class="col-lg-3 col-md-6 col-sm-12">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-body text-center p-4">
                        <i class="bi bi-lightning-charge text-warning display-4 mb-3"></i>
                        <h5 class="card-title fw-bold">Fast</h5>
                        <p class="card-text text-muted">Ready-made components</p>
                    </div>
                </div>
            </div>
            <div class="col-lg-3 col-md-6 col-sm-12">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-body text-center p-4">
                        <i class="bi bi-patch-check text-info display-4 mb-3"></i>
                        <h5 class="card-title fw-bold">Consistent</h5>
                        <p class="card-text text-muted">Design system</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Buttons Demo -->
        <div class="row mb-5">
            <div class="col-12">
                <h2 class="h3 fw-bold mb-4 text-center">Button Variants</h2>
                <div class="d-flex flex-wrap gap-3 justify-content-center">
                    <button class="btn btn-primary px-4 py-2">Primary</button>
                    <button class="btn btn-secondary px-4 py-2">Secondary</button>
                    <button class="btn btn-success px-4 py-2">Success</button>
                    <button class="btn btn-warning px-4 py-2 text-dark">Warning</button>
                    <button class="btn btn-danger px-4 py-2">Danger</button>
                    <button class="btn btn-outline-primary px-4 py-2">Outline</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
