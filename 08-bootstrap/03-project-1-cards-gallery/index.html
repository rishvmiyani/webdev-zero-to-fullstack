<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Cards Gallery - Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100 py-5">
    <div class="container">
        <!-- Header -->
        <div class="row mb-5">
            <div class="col-12 text-center">
                <h1 class="display-5 fw-bold text-dark mb-3">Featured Products</h1>
                <p class="lead text-muted">Discover our best-selling items</p>
            </div>
        </div>

        <!-- Cards Grid -->
        <div class="row g-4 mb-5">
            <!-- Card 1 -->
            <div class="col-xl-3 col-lg-4 col-md-6">
                <div class="card h-100 shadow-lg border-0 overflow-hidden hover-shadow-xl transition-all duration-300" style="transition: all 0.3s ease;">
                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=987&q=80" class="card-img-top" alt="Wireless Headphones" style="height: 250px; object-fit: cover;">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <h5 class="card-title fw-bold text-dark mb-0">Wireless Headphones</h5>
                            <span class="badge bg-success fs-6">$299</span>
                        </div>
                        <p class="card-text text-muted small mb-3">Premium noise-cancelling headphones with 30hr battery life</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="d-flex gap-1">
                                <i class="bi bi-star-fill text-warning"></i>
                                <i class="bi bi-star-fill text-warning"></i>
                                <i class="bi bi-star-fill text-warning"></i>
                                <i class="bi bi-star-fill text-warning"></i>
                                <i class="bi bi-star-half text-warning"></i>
                            </div>
                            <span class="text-muted small">(128)</span>
                        </div>
                    </div>
                    <div class="card-footer bg-transparent border-0 pt-0">
                        <button class="btn btn-primary w-100 fw-semibold">Add to Cart</button>
                    </div>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="col-xl-3 col-lg-4 col-md-6">
                <div class="card h-100 shadow-lg border-0 overflow-hidden hover-shadow-xl transition-all duration-300">
                    <img src="https://images.unsplash.com/photo-1583337130417-3346a1be7dee?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1000&q=80" class="card-img-top" alt="Smart Watch" style="height: 250px; object-fit: cover;">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <h5 class="card-title fw-bold text-dark mb-0">Smart Watch Pro</h5>
                            <span class="badge bg-danger fs-6">$199</span>
                        </div>
                        <p class="card-text text-muted small mb-3">Fitness tracker with heart rate, GPS, and sleep analysis</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="d-flex gap-1">
                                <i class="bi bi-star-fill text-warning"></i>
                                <i class="bi bi-star-fill text-warning"></i>
                                <i class="bi bi-star-fill text-warning"></i>
                                <i class="bi bi-star-fill text-warning"></i>
                                <i class="bi bi-star-fill text-warning"></i>
                            </div>
                            <span class="text-muted small">(256)</span>
                        </div>
                    </div>
                    <div class="card-footer bg-transparent border-0 pt-0">
                        <button class="btn btn-outline-primary w-100 fw-semibold hover-bg-primary transition-all">Add to Cart</button>
                    </div>
                </div>
            </div>

            <!-- Add 4 more similar cards for complete grid -->
            <!-- Card 3, 4, 5, 6 with different images/products -->
        </div>

        <!-- CTA -->
        <div class="row">
            <div class="col-12 text-center">
                <a href="#" class="btn btn-lg btn-primary px-5 py-3 fw-bold shadow-lg">View All Products</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
