<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Utilities Cheatsheet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-gradient min-vh-100">
    <div class="container py-5">
        <h1 class="display-4 fw-bold text-white text-center mb-5">Bootstrap Utilities</h1>
        
        <!-- Spacing -->
        <div class="row mb-5">
            <div class="col-12">
                <h2 class="h4 fw-bold text-white mb-4">Spacing (m-3 p-4)</h2>
                <div class="d-flex flex-wrap gap-3">
                    <div class="p-5 bg-primary text-white rounded shadow">p-5</div>
                    <div class="p-4 bg-success text-white rounded shadow">p-4</div>
                    <div class="p-3 bg-warning text-dark rounded shadow">p-3</div>
                    <div class="p-2 bg-danger text-white rounded shadow">p-2</div>
                    <div class="p-1 bg-info text-white rounded shadow">p-1</div>
                </div>
            </div>
        </div>

        <!-- Colors -->
        <div class="row mb-5">
            <div class="col-12">
                <h2 class="h4 fw-bold text-white mb-4">Colors</h2>
                <div class="row g-3">
                    <div class="col-md-3 col-sm-6">
                        <div class="p-4 bg-primary text-white rounded shadow text-center fw-bold">Primary</div>
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <div class="p-4 bg-success text-white rounded shadow text-center fw-bold">Success</div>
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <div class="p-4 bg-warning text-dark rounded shadow text-center fw-bold">Warning</div>
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <div class="p-4 bg-danger text-white rounded shadow text-center fw-bold">Danger</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Display & Flex -->
        <div class="row mb-5">
            <div class="col-12">
                <h2 class="h4 fw-bold text-white mb-4">Display & Flex</h2>
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 p-4 bg-white/10 rounded shadow">
                    <div class="d-none d-md-block bg-info text-white p-3 rounded">d-none d-md-block</div>
                    <div class="flex-grow-1 text-center text-white fw-bold">d-flex justify-center</div>
                    <div class="d-flex align-items-center gap-2">
                        <span class="badge bg-success">Flex Items</span>
                        <span class="badge bg-primary">Align Center</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Responsive -->
        <div class="row">
            <div class="col-12">
                <h2 class="h4 fw-bold text-white mb-4">Responsive Utilities</h2>
                <div class="d-grid gap-3">
                    <div class="p-4 bg-secondary text-white rounded shadow text-center d-none d-sm-block">Visible on sm+</div>
                    <div class="p-4 bg-dark text-white rounded shadow text-center d-block d-md-none">Visible on mobile only</div>
                    <div class="p-4 bg-light text-dark rounded shadow text-center">Always visible</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
